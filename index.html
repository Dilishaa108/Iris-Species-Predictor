<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iris Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Iris Species Predictor</h1>

  <form id="irisForm">
    <label>Sepal Length: <input type="number" step="0.1" id="sepalLength" required></label><br>
    <label>Sepal Width: <input type="number" step="0.1" id="sepalWidth" required></label><br>
    <label>Petal Length: <input type="number" step="0.1" id="petalLength" required></label><br>
    <label>Petal Width: <input type="number" step="0.1" id="petalWidth" required></label><br>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>
  <img id="speciesImage" src="" alt="Predicted species" style="width:200px; margin-top:10px;">

  <script src="script.js"></script>
</body>
</html>
